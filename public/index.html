ch1:{subtitle:'從畫面、聲音到詩人的感受',goal:'學會用「景物 → 修辭 → 氣氛 → 情感」四步閱讀新詩。',sections:[
{title:'先認識這一課',lead:'〈夏夜〉是一篇適合練習「用感官讀詩」的作品。讀詩不只是逐字翻譯，更要想像語言在腦中形成什麼畫面。',points:['先想像：夏夜可能看見什麼、聽見什麼、感覺到什麼？','閱讀時圈出景物名稱、聲音詞語與動作描寫。','不要把故事中的月亮眨眼當成課文原句；那是本站用來示範修辭的改寫。'],example:'想像一個夏夜：樹影在地面搖晃，遠處蟲鳴此起彼落。你感到的是熱鬧、神祕，還是平靜？',mistake:'把每一個意象都當作字面事實，忽略詩歌的想像性。'},
{title:'怎麼讀出詩歌畫面？',lead:'把詩中的線索分類，將抽象感覺變成可描述的具體印象。',points:['視覺：顏色、亮暗、距離、形狀。','聽覺：蟲鳴、風聲、人的活動。','觸覺：熱、涼、輕柔或強烈的風。','每找到一項線索，就問它共同營造什麼氣氛。'],example:'「細小蟲鳴在草叢中此起彼落」：聽覺線索是蟲鳴；可能營造富有生氣的夜晚。',mistake:'只背「這是聽覺」卻說不出它對整體氣氛的作用。'},
{title:'拆解三個修辭工具',lead:'常見考法不是只問修辭名稱，也會問「這個寫法帶來什麼效果」。',points:['擬人：把非人事物寫得像人，例如「微風輕聲說話」。','譬喻：把某物比作另一物，例如「星星像碎鑽」。','疊字：重複字詞，例如「輕輕」「點點」，加強語感及節奏。','修辭與主旨有關：可使夜景更親切、活潑或柔和。'],example:'「星星像小燈」是譬喻；「星星對我眨眼」是擬人，判斷依據不同。',mistake:'看見星星就選擬人；應看句子是否真的把它寫成人的動作。'},
{title:'段落與主旨如何連起來？',lead:'讀完全詩後，整理詩中的觀察順序，再推敲詩人對夏夜的感受。',points:['第一遍找「寫了什麼」；第二遍找「怎麼寫」。','把反覆出現的景物或動作聚成一組。','用「透過＿＿的描寫，營造＿＿氣氛，表達＿＿感受」歸納。','答案要以實際課文的用字作證據，不是憑個人印象。'],example:'示範句型：「透過夜風與蟲鳴的描寫，營造生動的夏夜氛圍。」',mistake:'一看到夜晚就認定作者一定寂寞；氣氛必須從文句支持。'},
{title:'考前整理與小練筆',lead:'用自己的話把閱讀方法講清楚，才代表真正理解。',points:['能指出一個視覺、一個聽覺線索。','能分辨擬人、譬喻與疊字。','能用兩句話歸納氣氛與感受。','能說明一種修辭為何適合描寫夏夜。'],example:'試寫：「夜風輕輕翻過書頁。」先判斷是否有擬人，再說它帶來的感覺。',mistake:'背完術語就直接作答，卻沒有把術語連回句子的意思。'}]},
ch2:{subtitle:'讀懂觀察、感受與生命思考',goal:'掌握「觀察到什麼 → 作者怎麼想 → 為何這樣想」的閱讀路線。',sections:[
{title:'這一課可以怎麼讀？',lead:'〈生之歌選〉適合練習抓取文本中的生命觀察與感受。以下是閱讀訓練方法，不代替課文逐段注釋。',points:['先找被描寫的人、事、物或自然現象。','圈出動作與變化，辨別哪些是文本直接描述。','留意作者如何由小事引出較深的思考。'],example:'「小草從石縫冒出」是觀察；「它展現生命韌性」是對觀察的詮釋。',mistake:'把讀者推論說成作者明確寫出的原句。'},
{title:'分辨事實與感受',lead:'文章可以同時包含可觀察的現象與主觀的情感，理解題常考它們之間的關係。',points:['事實或觀察：可以在文本中直接找到的細節。','感受：人物或作者對細節產生的情緒。','推論：從現象及語境推得、但文字未必直接說明的判斷。','推論需有依據，不能任意延伸。'],example:'「昆蟲沿樹枝爬行」可觀察；「牠非常勇敢」則需要更多依據。',mistake:'只要句子動人，就誤認為必定是客觀事實。'},
{title:'學會從細節抓主旨',lead:'想找到文章重點，不能只停留在一件事的表面描述。',points:['第一步：列出最有代表性的生活細節。','第二步：觀察它們共同帶來的感受。','第三步：歸納作者可能想傳達的想法。','最後用文章文字核對，不要強加「勵志」結論。'],example:'小草、蟬鳴與季節轉換都可以成為思考生命的起點，但各段感受需回到文章判定。',mistake:'把任何生命主題都回答成「只要努力就會成功」。'},
{title:'詞語放回上下文',lead:'一個詞語有多種意思時，必須依前後句選擇最符合情境的解釋。',points:['先判定該詞形容誰、在什麼情境出現。','看前後有無轉折、因果、對比或補充。','替換成自己的白話說法，檢查句意是否通順。'],example:'「破土」可指種子萌芽時穿出土壤；若用在比喻句中，也可能有更深的象徵意義。',mistake:'只看字典第一項意思，不確認文中語境。'},
{title:'整合閱讀：用證據說話',lead:'面對閱讀理解題，要同時做到「有結論」與「有文本依據」。',points:['回答主旨：指出觀察內容與感受間的連結。','回答段落作用：分清舉例、鋪陳、轉折或收束。','回答詞語：先讀句意再比較選項。','回答推論：排除超出原文資訊的選項。'],example:'作答模板：「從＿＿的描寫，可看出作者對＿＿抱持＿＿的感受。」',mistake:'答案聽起來合理，但沒有對應文章的具體線索。'}]},
ch3:{subtitle:'一口冰，讀出五感與記憶',goal:'理解感官描寫、時間安排、回憶與情感主題。',sections:[
{title:'從題目開始預測',lead:'〈吃冰的滋味〉可從食物經驗切入，學習記敘文如何把具體經驗寫出情感。以下示例非原文。',points:['思考「滋味」可能不只有舌頭感覺，也包含情緒。','看作者怎麼描述吃冰時的人物、場景與活動。','閱讀時留意是否出現從眼前情景回到過去的敘述。'],example:'同樣是吃冰，和朋友分享與獨自品嚐的記憶可能完全不同。',mistake:'只把題目理解成冰品口味排行榜。'},
{title:'五感描寫解剖室',lead:'好的感官描寫能讓讀者像在現場。',points:['視覺：冰品的顏色與形狀。','聽覺：湯匙碰到碗的聲音。','嗅覺：水果或糖漿的香氣。','味覺：酸、甜等滋味。','觸覺：冰涼、融化與顆粒感。'],example:'「金黃色果粒在透明冰塊間閃爍」是視覺；「冰涼從舌尖散開」涉及觸覺與味覺。',mistake:'把所有描寫都歸成味覺，忽略不同感官。'},
{title:'抓出敘事時間線',lead:'記敘文可以依事情發生的時間寫，也可以先寫現在再回憶過去。',points:['順敘：依先後次序敘述。','倒敘：先呈現較後面的情節，再回頭交代前情。','插敘：在主要敘述中插入補充事件。','判斷時要依實際文章的段落順序，不可只看一個詞。'],example:'「我今天路過冰店，忽然想起小時候……」呈現由眼前轉入回憶。',mistake:'看到「小時候」就直接判為倒敘；還要看全文安排。'},
{title:'從物品讀到情感',lead:'文章寫食物，可能同時在寫陪伴、成長、時代變遷或對往日的懷念。',points:['列出與冰品一起出現的人物及活動。','尋找帶有情緒的詞和關鍵事件。','比較事件前後人物的感受是否改變。','歸納主旨時分清「發生什麼」與「作者想表達什麼」。'],example:'「甜甜的」可能只是味覺；若搭配一段難忘的回憶，也可能有象徵意味。',mistake:'看到食物就忽略人物情感，或者沒有根據便認定主旨是親情。'},
{title:'閱讀題怎麼拿分？',lead:'四個檢查點幫你找到合理的答案。',points:['感官題：逐一對照描寫詞。','時間題：畫出現在、回憶與回到現在的箭頭。','詞義題：放回原句確認。','主旨題：用事件與情感雙重證據支持。'],example:'題目問「滋味」有何含義時，先問文章是否同時談到具體味道及心理感受。',mistake:'只選看起來最感人的選項，而不是最符合文本的選項。'}]},
geo:{subtitle:'學會像導航員一樣讀圖',goal:'理解地圖三要素、方向、比例尺、座標與簡易時間換算。',sections:[
{title:'地圖不是縮小照片',lead:'地圖以符號、方位與比例尺傳遞空間資訊。不同主題地圖呈現的資訊也不同。',points:['圖名：先判定這張圖想呈現什麼。','圖例：確認顏色、線條與符號的意義。','方向：先看指北針，再決定上下左右的方位。','比例尺：判讀圖上距離和實際距離的關係。'],example:'一張人口密度圖和一張交通路線圖即使範圍相同，圖例可能完全不同。',mistake:'沒看圖例就把顏色當成高低或好壞。'},
{title:'方向與相對位置',lead:'方向題要先判斷參考點，才談另一個地點相對在哪裡。',points:['一般地圖北方朝上時，上北、下南、左西、右東。','若圖中指北針旋轉，必須依箭頭重新判讀。','「甲在乙的東邊」和「乙在甲的西邊」是互為相反的描述。'],example:'在北方朝上的地圖中，學校在車站右上方，即學校位於車站東北方。',mistake:'不看指北針就直接套用右東左西。'},
{title:'比例尺換算實作',lead:'比例尺 1:100,000 表示圖上 1 單位對應實際 100,000 相同單位。',points:['寫出圖上距離 × 比例尺分母。','先用公分算，再換公尺或公里。','100,000 公分＝1 公里。','比例尺越大，通常可呈現較小範圍、較多細節。'],example:'圖上 3 公分，比例尺 1:200,000 → 實際 600,000 公分＝6 公里。',mistake:'忘記單位換算，誤把 600,000 公分看成 600,000 公里。'},
{title:'緯度、經度與座標',lead:'緯度描述南北位置，經度描述東西位置；地點可用一組座標表示。',points:['赤道是 0° 緯線；向北為北緯 N，向南為南緯 S。','本初經線是 0° 經線；向東為東經 E，向西為西經 W。','緯線大致東西延伸；經線連接南北兩極。','座標如 25°N, 121°E 表示北緯25度、東經121度。'],example:'23°S, 46°W 在南半球與西半球。',mistake:'把經度誤認為南北位置，或把東西半球和南北半球混淆。'},
{title:'時差與綜合判圖',lead:'地球自轉 360° 約 24 小時，可用每 15° 約 1 小時的關係做經度時差推算。',points:['先辨別兩地經度差。','經度往東，地方太陽時一般較早到達正午，鐘面時間較快。','題目若使用法定標準時間，必須另外考慮時區規定。','讀統計地圖時，先看圖名、圖例和單位，再回答。'],example:'只做理想化經度計算：120°E 與 135°E 相差15°，地方太陽時約差1小時。',mistake:'把經度計算得到的地方太陽時直接當成所有城市的法定時間。'}]},
hist:{subtitle:'用考古線索拼出臺灣早期歷史',goal:'分辨史前與歷史、考古證據、石器文化及多元族群。',sections:[
{title:'考古學家怎麼知道過去？',lead:'史前時代缺乏當時留下的文字記載，研究者透過遺址與出土器物重建人類生活。',points:['遺址：古人活動留下的場所與痕跡。','遺物：石器、陶器、骨器等物品。','地層及位置：有助判讀前後關係。','研究結論通常是有證據支持的推論，並非親眼看見。'],example:'出土魚骨可能提供捕魚或飲食線索，但不能單憑魚骨知道某人的姓名。',mistake:'把博物館復原圖當成完全確定的歷史照片。'},
{title:'史前與歷史的差別',lead:'最重要的分界概念是研究對象有沒有當時留下的文字史料，而非古老程度。',points:['史前研究主要依靠考古證據。','進入有文字記載的歷史時期後，文字與非文字史料可相互參照。','不同地區進入歷史時代的時間不一定相同。'],example:'一段口耳相傳的故事有文化價值，但要研究史前年代仍需比對考古與其他證據。',mistake:'以為「史前」代表完全沒有任何資訊可以研究。'},
{title:'石器時代的重要線索',lead:'考古學常用工具技術與生活方式比較不同階段。',points:['舊石器時代常見打製石器。','新石器時代常見磨製石器，並可見陶器等文化特徵。','器物與生產方式需要一起考察，不能只憑單件器物判定所有生活細節。'],example:'出土磨製石斧與陶片，可能提示與新石器時代相關的文化特徵，仍須結合地層與年代。',mistake:'以為所有使用石器的社群都同時過著完全一樣的生活。'},
{title:'臺灣史前文化如何比較？',lead:'辨別不同文化時，著重時間、分布、工具、居住和生計方式等證據。',points:['閱讀考古分布圖時先看年代與地點。','比較表格可整理器物類型與生活方式。','臺灣各地史前文化並非在同一時間完全一致。','具體文化名稱及年代應以課本與試卷圖表為準。'],example:'在地圖上找出遺址位置，再思考海岸、河流和資源可能與生活方式的關係。',mistake:'只背遺址名稱，卻不理解它代表哪種證據。'},
{title:'認識原住民族文化多樣性',lead:'史前文化與現今原住民族不能在缺少證據時直接一對一對應。',points:['原住民族有不同的語言、習俗、歷史與文化。','尊重當事族群的自我稱呼與文化觀點。','考古推論與現代族群文化需區分來源。','理解歷史時避免「所有族群都相同」的刻板印象。'],example:'同一個博物館展區可以並列考古出土器物與族群口述歷史，但應清楚標示各自來源。',mistake:'把某一族的生活方式當成全體原住民族唯一的樣貌。'}]},
civic:{subtitle:'把尊嚴、人權與平等帶進校園生活',goal:'能辨識尊重差異、隱私、權利保障與合理的處理方法。',sections:[
{title:'什麼是人性尊嚴？',lead:'每個人都具有基本價值，尊重不應由成績、外貌、財富或人氣決定。',points:['不因差異否定別人的價值。','尊重他人，也需要維護自己的尊嚴。','日常語言、班級制度與網路互動都會影響他人尊嚴。'],example:'同學表達方式與你不同，仍應讓他有被傾聽的機會。',mistake:'認為只有表現優秀者才值得被尊重。'},
{title:'人權如何落實在生活中？',lead:'人權是每個人都應受到保障的基本權利，日常生活中可以從平等、隱私、意見表達等面向理解。',points:['平等：避免無正當理由的差別待遇。','隱私：不擅自散布他人個人資訊。','表意：讓意見能以尊重他人的方式被聽見。','保障權利也須考慮他人的權利。'],example:'未經同意把同學的私人照片傳到群組，可能侵害隱私與尊嚴。',mistake:'以為自己有發言自由，就能隨意羞辱其他人。'},
{title:'平等不等於每人都相同',lead:'每個人情況不同，公平的安排常需要考慮合理需求。',points:['形式相同的規定可能造成不同影響。','理解合理差異有助於設計更公平的做法。','判斷差別待遇是否合理，要看理由與目的。'],example:'校園提供無障礙通道，是讓不同需求者都能合理使用公共空間。',mistake:'認為給予必要協助就一定是不公平的特權。'},
{title:'遇到霸凌與隱私問題',lead:'面對不當言語、散布照片等情境，最重要的是減少傷害與尋求協助。',points:['不要轉傳傷害他人的文字或照片。','在安全的情況下支持受影響的人。','必要時請導師、家長或可信任的大人介入。','保留必要資訊時也應避免再次散布造成傷害。'],example:'同學被群組嘲笑時，可以停止加入嘲笑並請老師協助處理。',mistake:'以為旁觀者不參與嘲笑，就完全無法做任何幫助。'},
{title:'把公民概念用在情境題',lead:'公民題常提供一段事件，要求你辨識權利與較合理的作法。',points:['先找出哪些人受到影響。','確認是否涉及尊嚴、平等、隱私或表意。','比較每個選項是否尊重各方權益。','選擇能降低傷害、合理兼顧權利的作法。'],example:'學生代表會議只讓少數人說話：試想如何建立合理、可參與的討論程序。',mistake:'只看誰的聲音比較大，就當作他的權利比較重要。'}]}
};
let guideState=null;
function beginGuide(id){if(!deepLessons[id]){beginLesson(id);return}lessonState=null;guideState={id,page:0};showGuide()}

const paragraphModules={"ch1":[["進入夏夜：把文字變成畫面","詩的閱讀不是先找標準答案，而是先找場景。想像自己站在傍晚的戶外：光線從明亮變暗，細小的聲音慢慢清楚。這個練習幫助你辨識詩中可能出現的視覺、聽覺與觸覺線索。","「暮色慢慢蓋上屋頂，樹葉在晚風裡搖動。」","白話：天漸漸暗下來，樹葉被風吹得晃動。前半句用「蓋上」把暮色寫成有動作的事物；後半句寫出眼睛看得到的動態。","不要把這句當成〈夏夜〉原文。閱讀正式課文時，請找出真正寫到的景物。",["「樹葉在晚風裡搖動」最直接使用哪種感官線索？",["視覺","味覺","嗅覺","聽覺"],0,"搖動的樹葉是看得到的動態，屬視覺描寫。"],["若要描寫夏夜的聲音，哪句最合適？",["晚風帶來涼意","草叢傳來斷續蟲鳴","天空有淡淡月光","路旁樹影修長"],1,"蟲鳴由耳朵接收，是聽覺線索。"]],["找出景物：一個畫面怎麼組成","閱讀新詩時，可以把每一個景物視為拼圖。先標示「誰／什麼東西」，再標示它的「動作或狀態」，最後想像這些拼圖合起來的氣氛。","「窗邊的燈亮著，遠處的山安靜地伏在夜色裡。」","白話：近處有亮燈，遠處的山在黑暗中靜靜呈現。近景與遠景相互對照，讓空間有層次。","近景和遠景並不是作者必定使用的段落安排；要由課文實際敘寫順序判斷。",["「窗邊的燈」與「遠處的山」形成哪種空間對照？",["高低","遠近","過去未來","內心外在"],1,"一個位於近處，一個在遠處，形成遠近層次。"],["整理詩歌意象時，第一步最適合做什麼？",["只記作者姓名","把景物與動作圈出","猜測尚未讀到的結局","計算總筆畫"],1,"意象整理需要先回到文字中的具體線索。"]],["修辭解密：擬人、譬喻、疊字","三種修辭的判讀關鍵不同：擬人是賦予非人事物人的動作或情感；譬喻是用相似處連結兩事物；疊字則靠重複語音增強節奏或狀態。","「風兒悄悄訴說故事」「星光像細碎的銀粉」「微微的光落在地上」","白話：第一句將風寫成人會說故事；第二句把星光比作銀粉；第三句用「微微」描寫程度並形成節奏。","「有像」不一定是譬喻；要檢查兩種事物是否真有比擬關係。",["「風兒悄悄訴說故事」主要運用什麼修辭？",["擬人","排比","誇飾","設問"],0,"風本來不會說故事，句子給它人的動作，因此是擬人。"],["「星光像細碎的銀粉」主要運用什麼修辭？",["引用","譬喻","對偶","頂真"],1,"以銀粉比作閃亮細碎的星光，利用相似特徵構成譬喻。"]],["從景物推論氣氛與情感","景物不會自動等於固定情感。「夜晚」可能溫馨、靜謐，也可能神祕、孤寂。答題時要找到詞語與動作作證據，不能只靠個人聯想。","「巷口燈火溫暖，家人說笑聲從窗裡傳來。」","白話：夜晚街上亮著燈，屋內有家人歡笑。燈火與笑聲共同支持「溫暖、親近」的氣氛。","若只有一個「黑夜」意象，不能直接推論作者悲傷。",["根據「燈火溫暖、家人說笑」，最有根據的氣氛判斷是？",["驚恐不安","溫馨親切","激烈衝突","嚴寒蕭瑟"],1,"溫暖燈光與說笑的聲音一起支持溫馨感。"],["推論作品情感時，最重要的依據為何？",["段落長短","讀者當天心情","文本中的詞語與場景","題目字數"],2,"情感推論必須能指出支持它的文本證據。"]],["整首詩總整理：用證據說主旨","整理一首詩可以用四格筆記：場景在哪裡、出現哪些意象、用了哪些修辭、情感怎麼呈現。每一格都要回到實際文句。","示範答題：「透過夜風、星光等景象的描寫，呈現寧靜柔和的夜晚。」","白話：句子先說寫了什麼，再說這些描寫共同營造的感受；如果正式課文景物不同，答案也要跟著改。","別把這份練習的示範主旨直接當成正式課文標準答案。",["完整的詩歌主旨解說，最應包含什麼？",["景物線索與情感解讀","作者姓氏與座號","所有字的筆畫","詩句有幾行"],0,"主旨需說明文本內容如何呈現情感或想法。"],["哪一種答題最符合文本證據原則？",["只寫「因為我喜歡夜晚」","引用文句並解釋氣氛","套用任何詩都能用的答案","只抄題目"],1,"能說明實際文句與解讀之間的關係，答案才有根據。"]]],"ch2":[["從細小事物開始觀察","閱讀生命主題作品時，先分辨作者「看到了什麼」與「想到什麼」。作品常藉由生活中的具體現象，引出較抽象的感受與思考。","「雨後，牆角一株小草冒出新葉。」","白話：雨後小草長出新的葉子。這是可觀察到的現象；若說「生命充滿希望」，則是對現象的延伸解讀。","示範情境不是〈生之歌選〉原句，也不能直接代替作者觀點。",["「小草長出新葉」屬於哪一類內容？",["直接觀察","作者生平","人物對話","寫作年代"],0,"句子直接描述能看見的自然現象。"],["「這讓我想到堅持的力量」比較接近？",["客觀量測","情感與體會","地理座標","歷史紀年"],1,"這是觀察者由事件產生的想法與感受。"]],["事實、感受與推論的界線","文章裡有三層：事實是文本寫到的現象；感受是人物直接表達的情緒；推論則是讀者根據證據整理出的可能意義。考題常利用這三層混淆選項。","「孩子扶起倒下的花盆，心裡感到欣慰。」","白話：孩子做了一個動作，並且覺得開心、安慰。扶花盆是行動，欣慰是明確感受。","若文本沒說作者「憤怒」，就不能把個人推測寫成明確的作者感受。",["句中「心裡感到欣慰」屬於？",["地點描寫","感受描述","計量資訊","聲音描寫"],1,"欣慰指人物心中的情緒。"],["文章只說「他停下腳步」，哪個推論最謹慎？",["他一定生氣","他一定受傷","先查看前後文才判斷原因","他已決定離開"],2,"停步可能有多種原因，必須結合前後文。"]],["細節怎麼通向作品主旨","主旨不是所有段落的摘要清單，而是把重複或相互呼應的事例連成共同想法。先把每段重點寫成短句，再觀察共通關係。","「有人照顧幼苗；有人耐心等待新芽；有人分享收成。」","白話：三個不同事件都包含對生命的照料和陪伴，因此可歸納一個共通的主題。","範例可練習歸納，不表示正式課文一定具有相同段落。",["整理數個生活事例後，下一步最適合？",["找到共同指向的觀念","只挑最長的一段","忽略段與段的關係","把每個例子抄十次"],0,"從多個例子找共通意義，可以逐步歸納主旨。"],["若各段都在描述照料生命的行動，哪種主旨比較有根據？",["研究火山形成","關懷與珍惜生命","介紹交通號誌","比較時區"],1,"主旨應與反覆出現的行動及意義一致。"]],["詞義要回到語境","同一詞語在不同前後文可能代表不同含義。先讀完整句，找出主詞、動作與因果關係，再替換成合理的白話說法。","「她守著那個約定，即使遇到困難也沒有改變。」","白話：「守著」在這裡不是站崗看守，而是持續遵守、沒有放棄約定。","只看單一詞語就選答案，容易落入字面義陷阱。",["句中「守著約定」的「守著」最接近？",["繼續遵守","用手握住","坐在門口","把物品藏起"],0,"與「約定」搭配，意思是持續履行承諾。"],["判讀一字多義時，首要策略是？",["只讀單字","放回前後文","先選最少字選項","選自己最熟悉的意思"],1,"語境會限制詞語在這裡的合理意義。"]],["用證據說出生命感悟","作答可採「例子—理解—證據」：先指出具體事件，再說由此推得的想法，最後解釋哪個文字細節支持判斷。","「因為人物在失敗後仍繼續練習，因此可以推論其重視努力。」","白話：不是單純說「他努力」，而是指出失敗後仍練習這項行動作為根據。","把讀者的延伸感受誤寫成作者原文，是閱讀題常見扣分原因。",["哪一個回答比較有說服力？",["他很堅強，因為我覺得","他失敗後再練習，展現堅持","所有人都應該一樣","故事一定會有好結局"],1,"先指出事件，再連結可合理推導的性格。"],["沒有課文原句支持時，應如何處理推論？",["標示為可能推論","說成作者明言","寫成唯一答案","直接略過全文"],0,"把推論與明示區分開，能避免過度解讀。"]]],"ch3":[["一口冰，為什麼能變成故事","記敘文會從具體事件走向感受。讀〈吃冰的滋味〉這類題材時，可留意「什麼時候、誰一起、在哪裡、發生什麼」及其情緒變化。","「放學後，我拿著一杯冰，坐在熟悉的小店門口。」","白話：交代時間、人物行動與地點，讓故事有可想像的起點。","句子是原創例子，不能視為課文的第一段。",["「放學後」交代記敘文的哪一項？",["時間","原因","結果","感想"],0,"放學後指出事件發生的時間。"],["要還原記敘事件，最需要先整理？",["人物、時間、地點與事件","文章總筆畫","考卷頁數","作者所有作品"],0,"記敘文的基本線索有助於了解事情的經過。"]],["五感帶你到現場","五感是視覺、聽覺、嗅覺、味覺、觸覺。作者可以交錯使用多種感官，讓讀者感到彷彿身在現場。","「紅色糖漿亮晶晶，湯匙敲著碗，冰涼感一路滑過舌尖。」","白話：紅色、亮晶晶是視覺；湯匙敲碗是聽覺；冰涼是觸覺；如果出現甜酸滋味則是味覺。","味覺不等於所有與食物有關的描寫；例如顏色仍是視覺。",["「湯匙敲著碗，發出清脆聲」屬？",["聽覺","嗅覺","味覺","觸覺"],0,"「清脆聲」是耳朵聽到的聲音。"],["「舌尖感到酸甜」屬？",["視覺","味覺","聽覺","嗅覺"],1,"酸甜是舌頭感知的味道。"]],["把事件排成時間線","記敘文不一定照實際時間從頭寫到尾。可以先寫現在，再回憶過去；也可以在主要敘述中插入另一段往事。辨認敘事順序，要看時間線索。","「今天經過小店，我想起三年前第一次吃冰的夏天。」","白話：敘事先在今天，接著回到三年前的回憶。閱讀時可畫出「現在 → 過去」的時間箭頭。","僅憑「回想」一詞未必能判定整篇都採倒敘，仍需看篇章安排。",["句子先寫今天，再回到三年前，時間線為？",["現在→過去","過去→現在","未來→未來","無時間變化"],0,"由今天的敘述轉到三年前的回憶。"],["判斷文章敘事順序，最有效的做法是？",["標記時間詞並畫事件順序","只看有幾個人物","統計形容詞","只讀結尾"],0,"時間標記可以幫助整理事件先後。"]],["滋味不只在舌尖","記憶中的食物往往與人物關係、場所、年代相連。「滋味」可能包含味道，也可能延伸成難忘的情緒。要先找出文本有哪些人事物，再推論感情。","「冰早已融化，祖母當年的笑聲卻一直留在記憶裡。」","白話：冰品的物理味道消失了，但與祖母共度時光的情感仍被珍藏。這是食物與記憶的連結。","此例只示範閱讀思路；正式課文是否寫到家人，要依課文為準。",["例句真正強調的重點是？",["回憶中的陪伴","冰的價格","糖水配方","氣溫記錄"],0,"笑聲留在記憶，表現人物陪伴與懷念。"],["閱讀「滋味」的延伸含意時，應先確認？",["文中與食物相連的人與事件","封面色彩","每句標點數","字體大小"],0,"感受必須從文章實際事件與人物關係推導。"]],["段考解題：由描寫走向主旨","面對閱讀題，先找問題問的是感官、時間、詞義、情感還是主旨；回到相應句子作答。最常見失誤是只記得食物，忘了情緒變化。","示範作答：「藉由描寫吃冰的過程，連結往日的人與事，帶出懷念。」","白話：回答主旨時，不只重述「吃冰」，也解釋事件承載的情感；正式答案需依課文內容調整。","示範答法不是本文經校對的標準主旨。",["回答記敘文主旨題，最合理的結構是？",["事件＋情感或想法","只寫物品名稱","只寫作者年代","抄寫題目"],0,"記敘文常藉事件傳達情感或思考。"],["哪種行為最可能造成閱讀理解失分？",["回原文查線索","辨別感官","只根據題目猜主旨","畫出時間線"],2,"僅憑標題猜主旨，缺乏文章內容支持。"]]]};

function answerSegment(n,selected){const key=paragraphKey(),m=paragraphModules[guideState.id][guideState.page],q=m[5+n];paragraphQuiz[key]??=[false,false];if(selected===q[2])paragraphQuiz[key][n]=true;else paragraphQuiz[key][n]=false;showGuide()}
function showGuide(){if(!guideState)return;const id=guideState.id;
if(!paragraphModules[id])return showGuideLegacy();
const w=qworld(id),i=guideState.page,m=paragraphModules[id][i],key=paragraphKey(),done=segmentDone(key);

function examSetup(){screen.innerHTML=`<div class="hero"><div><div class="label">MOCK EXAM</div><h2>📝 模擬考試中心</h2><p>單科或跨科混合測驗；限時交卷、最後統一公佈答題解析。</p></div><span class="iconbig">📋</span></div><div class="filters"><select id="examSubject"><option value="all">國文＋社會綜合</option><option value="國文">國文</option><option value="地理">地理</option><option value="歷史">歷史</option><option value="公民">公民</option></select><select id="examLevel"><option value="all">綜合難度（A/B/C 混合）</option><option value="1">A 型｜基礎</option><option value="2">B 型｜應用</option><option value="3">C 型｜挑戰</option></select><select id="examTime"><option value="600">10 分鐘</option><option value="1200" selected>20 分鐘</option><option value="1800">30 分鐘</option></select><button class="btn primary" onclick="startExam()">開始模擬考</button></div><div class="notice">A/B/C 為本站練習難度分級，不代表完整轉錄原試卷 A/B/C 題目；未提供的題目與圖表不會假裝已匯入。</div>`}

function start(mode,id,level){if(mode==='adventure'&&!data.lessons?.[id]){beginGuide(id);return}let qs=questions.filter(q=>q.world===id&&q.level===level);startSession(mode,qs,{world:id,level})}
function startSession(mode,qs,meta={}){if(!qs.length){alert('此組合沒有題目，請調整條件。');return}stopClock();session={mode,qs,index:0,answers:{},checked:{},earned:0,meta,remain:meta.seconds??null};if(mode==='exam'){tick=setInterval(()=>{if(!session||session.mode!=='exam'){stopClock();return}session.remain--;let t=document.getElementById('timer');if(t)t.textContent=timeFmt(Math.max(0,session.remain));if(session.remain<=0)finish()},1000)}showQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function showQuestion(){if(!session)return;let s=session,q=s.qs[s.index],chosen=s.answers[q.id],seen=!!s.checked[q.id],exam=s.mode==='exam',w=qworld(q.world);screen.innerHTML=`<section class="quiz"><div class="quizheader"><div class="label">${s.mode==='adventure'?'章節冒險':exam?'限時模擬考':s.mode==='review'?'錯題複習':'自由練習'} · ${w.icon} ${w.title}</div><div class="pill">${s.index+1} / ${s.qs.length} ${exam?`· ⏱ <span id="timer">${timeFmt(Math.max(0,s.remain))}</span>`:''}</div></div><div class="bar" style="margin:16px 0"><div style="width:${(s.index+1)/s.qs.length*100}%"></div></div><div class="minor">${['','基礎','應用','挑戰'][q.level]} · ${q.id} · ${exam?'交卷後顯示答案':'作答後立即顯示解析'}</div><h2>${q.text}</h2>${q.options.map((opt,i)=>`<button class="option ${seen&&!exam?(i===q.answer?'correct':i===chosen?'wrong':''):''}" ${seen?'disabled':''} onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${opt}</span></button>`).join('')}${seen&&!exam?`<div class="feedback"><b>${chosen===q.answer?'✅ 答對了！ +10 XP':'❌ 再加油！正解是 '+ 'ABCD'[q.answer]}</b><p>${q.explain}</p><span class="source">${q.source}</span></div>`:''}<div class="actions">${exam?`<button class="btn" ${s.index===0?'disabled':''} onclick="step(-1)">上一題</button>`:''}<button class="btn primary" ${chosen===undefined?'disabled':''} onclick="next()">${s.index===s.qs.length-1?exam?'交卷':'完成挑戰':'下一題 →'}</button><button class="btn" onclick="exitSession()">離開</button></div>${exam?'<div class="minor">模擬考允許重新選答；只在最後交卷時評分。</div>':''}</section>`}
function choose(i){let s=session,q=s.qs[s.index];if(s.checked[q.id])return;s.answers[q.id]=i;if(s.mode!=='exam'){s.checked[q.id]=true;const right=i===q.answer;data.xp+=right?10:0;data.streak=right?(data.streak||0)+1:0;if(!right)data.mistakes[q.id]=(data.mistakes[q.id]||0)+1;else delete data.mistakes[q.id];save()}showQuestion()}
function step(n){session.index=Math.max(0,Math.min(session.qs.length-1,session.index+n));showQuestion()}
function next(){let s=session;if(!s)return;if(s.answers[s.qs[s.index].id]===undefined)return;if(s.index===s.qs.length-1){finish();return}s.index++;showQuestion()}
function finish(){let s=session;if(!s)return;stopClock();let correct=s.qs.filter(q=>s.answers[q.id]===q.answer).length,score=Math.round(correct/s.qs.length*100);if(s.mode==='exam'){s.qs.forEach(q=>{if(s.answers[q.id]===q.answer){data.xp+=10;data.streak++ ;delete data.mistakes[q.id]}else{data.streak=0;data.mistakes[q.id]=(data.mistakes[q.id]||0)+1}})}if(s.mode==='adventure'&&score===100){let {world,level}=s.meta;data.completed[world]??={};data.completed[world][level]=true;if(level===3&&!data.badges.includes(world))data.badges.push(world)}if(s.mode==='adventure'&&score<100)data.streak=0;data.history.unshift({at:new Date().toLocaleString('zh-TW'),type:s.mode,world:s.meta.world||s.meta.subject||'綜合',level:s.meta.level||'綜合',correct,total:s.qs.length,score});data.history=data.history.slice(0,100);if(score===100&&!data.badges.includes('perfect'))data.badges.push('perfect');save();session=null;const html=`<section class="quiz"><div class="label">MISSION REPORT · 學習結算</div><h2>${score===100?'🎉 完美通關！':score>=70?'🌟 挑戰完成！':'💪 再練一次會更好'}</h2><div class="report"><div class="metric"><strong>${score}</strong>分數 / 100</div><div class="metric"><strong>${correct}/${s.qs.length}</strong>答對題數</div><div class="metric"><strong>${s.qs.length-correct}</strong>本次錯題</div></div>${s.mode==='adventure'&&score!==100?'<p class="note">章節冒險需全部答對才可解鎖下一關。可重試本關。</p>':''}<h3>逐題回顧</h3>${s.qs.map((q,i)=>`<details style="padding:12px 0;border-bottom:1px solid #36465a"><summary>${s.answers[q.id]===q.answer?'✅':'❌'} 第 ${i+1} 題：${q.text}</summary><p class="minor">你的回答：${s.answers[q.id]===undefined?'未作答':'ABCD'[s.answers[q.id]]}｜正解：${'ABCD'[q.answer]}</p><p>${q.explain}</p></details>`).join('')}<div class="actions"><button class="btn primary" onclick="change('adventure')">返回冒險地圖</button><button class="btn" onclick="change('review')">複習錯題</button><button class="btn" onclick="change('exam')">再做模擬考</button></div></section>`;screen.innerHTML=html}

證據；本站教學示例不能冒充課文原句。"}]},{"id":"punct","number":"語文天地一","title":"標點符號使用法","icon":"✍️","focus":"標點符號","intro":"以語氣與句子結構決定標點，練習常見符號的用途。","sections":["句末語氣：敘述用句號、直接疑問用問號、強烈感嘆常用驚嘆號。","句內組織：並列短項目常用頓號；列舉或引出說話內容可用冒號。","引用與停頓：引號標示直接引語；逗號與分號的停頓及結構層次不同。"],"questions":[{"q":"「文具盒裡有鉛筆□橡皮擦□尺。」空格較適合填入？","options":["問號","分號","頓號","破折號"],"answer":2,"why":"並列列舉的短項目適合使用頓號。"},{"q":"「你今天有空嗎□」應填入？","options":["？","。","、","；"],"answer":0,"why":"整句是直接疑問，末尾用問號。"},{"q":"「老師說□『請先閱讀。』」空格應填？","options":["冒號","問號","頓號","省略號"],"answer":0,"why":"冒號可以引出後面的直接引語。"},{"q":"面對本單元的閱讀測驗，哪種策略最可靠？","options":["回到文句找證據再判斷","只憑選項長度","只看題目猜答案","把生活例句當原文"],"answer":0,"why":"閱讀作答須回到文本證據；本站教學示例不能冒充課文原句。"}]},{"id":"ch4","number":"L4","title":"差不多先生傳","icon":"🧐","focus":"倒反與諷刺","intro":"胡適以人物敘事傳達對含糊馬虎態度的批判；閱讀時注意反諷與情節因果。","sections":["認識人物：人物反覆用「差不多」處理事情的模式，是理解批判目標的重要線索。","讀懂倒反：表面像在稱讚，實際藉上下文表達相反意思，不能只看字面。","連結生活：區分可容許的小差異與不能馬虎的醫療、安全、時間等場合。"],"questions":[{"q":"文中若以「真是了不起的細心」諷刺一個總是粗心的人，最接近？","options":["引用","倒反","譬喻","設問"],"answer":1,"why":"表面讚美、實際批評，呈現倒反修辭的諷刺效果。"},{"q":"差不多先生式的處事方式，最值得反思的問題是？","options":["忽略差異可能造成後果","任何事情都應越快越好","所有差異都不重要","只要口頭答應就算完成"],"answer":0,"why":"作品批評對重要差異不加辨別的態度。"},{"q":"閱讀諷刺語句時，最重要的是？","options":["結合上下文理解真正立場","只看字面稱讚","數修辭總數","略過故事結局"],"answer":0,"why":"反諷往往需要上下文才能辨識。"},{"q":"面對本單元的閱讀測驗，哪種策略最可靠？","options":["回到文句找證據再判斷","只憑選項長度","只看題目猜答案","把生活例句當原文"],"answer":0,"why":"閱讀作答須回到文本證據；本站教學示例不能冒充課文原句。"}]},{"id":"ch5","number":"L5","title":"論語選","icon":"📜","focus":"文言語意與儒家觀念","intro":"認識《論語》的語錄體特色，將短句轉成白話並連結學習與待人處世。","sections":["讀文言四步：先看分句、辨語氣與關鍵字，再轉成通順現代語；不能只逐字硬換。","學習與反省：觀察學習、溫習、向他人取長補短等觀念如何連到日常。","待人處世：以同理與自我約束思考互動，並辨識孔子、孟子等儒家人物稱號。"],"questions":[{"q":"「三人行，必有我師焉」的理解何者較恰當？","options":["只向年紀大的人學習","同行者都有值得學習或借鏡之處","三個人必須有同一位老師","只要三人同行就不用學習"],"answer":1,"why":"重點是從周遭人的長處和不足中學習與反省。"},{"q":"《論語》主要以何種形式記錄思想與言行？","options":["語錄為主","長篇戲劇","科學實驗報告","旅遊圖冊"],"answer":0,"why":"《論語》主要以簡短記言及對話方式記錄。"},{"q":"「己所不欲，勿施於人」最貼近何種態度？","options":["推己及人","逞強爭勝","隨意揣測","互不理會"],"answer":0,"why":"重點是以自身感受衡量，不強加自己不願承 function bookStart(id){bookState={mode:'teach',id,step:0};bookShowTeach()}

const socialDeep=[{"id":"geo1","subject":"地理","title":"地圖與座標系統","icon":"🧭","focus":"位置、相對位置、絕對位置、圖例、比例尺與經緯度","sections":[{"title":"位置是怎麼說的？","explain":"「圖書館在校門口東側」是相對位置；「北緯 25°、東經 121°」是利用經緯度表示位置。前者依參照物描述，後者用固定座標。","example":"找學校：先以校門當參照物判斷東西南北；若需要在全世界定位，改用經緯度。","pitfall":"不要以「有方向」就判定是絕對位置。","question":{"q":"「市場在車站北方」屬於哪一種位置描述？","options":["絕對位置","相對位置","經度","緯度"],"answer":1,"why":"以車站作參照，描述市場的方位，因此是相對位置。"}},{"title":"學會讀地圖","explain":"先看圖名確認主題，再看方向標、圖例、比例尺與座標。圖例代表地圖符號；如果比例尺不同，能顯示的細節也不同。","example":"同一個校園用大比例尺畫，可清楚標示教室；全臺灣地圖通常以小比例尺呈現整體。","pitfall":"圖上看起來近不代表實際距離近，還要看比例尺。","question":{"q":"要了解地圖符號代表什麼，應先看？","options":["圖例","經線","氣壓","標高"],"answer":0,"why":"圖例用來解釋各種符號與顏色的含意。"}},{"title":"經緯度快速判讀","explain":"緯線大致東西向延伸，緯度以赤道為 0°，向南北遞增；經線連接南北兩極，經度以本初經線為 0°，向東西計算。","example":"25°N、121°E：北半球、東半球；25°S、121°W：南半球、西半球。","pitfall":"不要把「東經」當作位於東方；先分清經度與緯度。","question":{"q":"座標 23°N、120°E 位於哪兩個半球？","options":["北半球與東半球","南半球與東半球","北半球與西半球","南半球與西半球"],"answer":0,"why":"N 代表北緯、E 代表東經。"}},{"title":"時區與方位","explain":"地球自西向東自轉，因此一般而言東邊地方的時間較早進入下一個時刻。地圖的東西方向與經線度數搭配使用。","example":"臺灣採 UTC+8；如果某地為 UTC+9，當臺灣上午 8 點，該地是上午 9 點。","pitfall":"時差要依時區而不是單看直線距離。","question":{"q":"臺灣 10:00、另一地 UTC+9，該地時間為？","options":["09:00","10:00","11:00","12:00"],"answer":2,"why":"臺灣 UTC+8，UTC+9 快一小時，故為 11:00。"}}]},{"id":"geo2","subject":"地理","title":"位置對臺灣的影響","icon":"🌊","focus":"島嶼位置、季風、海峽、航運與生態","sections":[{"title":"臺灣在哪裡？","explain":"臺灣位於亞洲東部、太平洋西緣，東側面向太平洋，西側隔臺灣海峽與中國大陸相望。這是理解交通、氣候與生態的起點。","example":"看東亞地圖，圈出臺灣海峽與太平洋，思考不同方向的航行路徑。","pitfall":"臺灣「是島嶼」不等於交通必定不便，需結合地形與運輸技術判斷。","question":{"q":"臺灣西側與中國大陸之間的海域是？","options":["太平洋","臺灣海峽","印度洋","北冰洋"],"answer":1,"why":"臺灣西側為臺灣海峽，東側面向太平洋。"}},{"title":"海陸與季風","explain":"海陸受熱差異與季風環流會影響風向與降水；臺灣不同季節、地區的降雨差異也受地形影響。","example":"冬季東北季風常讓北部、東北部迎風面較容易降雨；夏季不同天氣系統也會帶來雨量。","pitfall":"地理現象不能只用緯度一項解釋。","question":{"q":"理解不同季節降雨變化，較需要同時考慮？","options":["季風與地形","地名筆畫","課本頁碼","經度數字大小"],"answer":0,"why":"季風帶來的水氣與地形迎背風面共同影響降雨。"}},{"title":"海峽與航運","explain":"臺灣海峽是臺灣與中國大陸之間的重要海域；位置連結東亞航線，也影響人群往來與經濟活動。","example":"看航線圖時，先分辨「經過」與「目的地」，再推理航線可能為何經過某處。","pitfall":"不是所有船隻都只走同一條航線。","question":{"q":"臺灣周邊海域作為航運要道，最直接關聯的是？","options":["交通位置","字詞修辭","年齡代稱","地層年代"],"answer":0,"why":"位處東亞海上交通路線附近，是地理區位的重要影響。"}},{"title":"海流與生物","explain":"海流會影響海水溫度、養分與海洋生態；暖流與冷流的差異有助理解漁場和沿岸環境。","example":"當魚類分布與海流方向有關時，應比較海溫、季節及洋流類型。","pitfall":"看到漁產多，不可直接推論一定是某一種海流造成。","question":{"q":"海流可能改變何種自然環境條件？","options":["海水溫度及漁業生態","太陽自轉方向","地球經線數量","日曆月份"],"answer":0,"why":"洋流會輸送不同溫度的海水並影響海洋生態。"}}]},{"id":"geo3","subject":"地理","title":"地形、氣候與圖表判讀","icon":"🏔️","focus":"等高線、地形剖面、雨溫圖、統計地圖","sections":[{"title":"地形的高低與坡度","explain":"等高線連接海拔高度相同的地點；線距密通常表示坡陡，距離疏通常表示坡緩。","example":"在兩段相同圖幅大小的等高線圖中，比較線條疏密推測爬坡難易。","pitfall":"要確認等高距及比例尺，不能只數等高線。","question":{"q":"等高線密集通常表示？","options":["坡度較陡","坡度較平緩","海拔必定為零","地圖必定較小"],"answer":0,"why":"在同一圖上，相鄰等高線越密，坡度通常越陡。"}},{"title":"雨溫圖怎麼看","explain":"折線常呈現氣溫、長條常呈現降水，但仍應先看圖例、座標軸與單位。","example":"讀 7 月雨量前，先確認縱軸單位是否是毫米。","pitfall":"圖表的顏色不會自動告訴你代表什麼。","question":{"q":"閱讀雨量長條圖，最應先確認？","options":["單位與圖例","圖片邊框","表格字型","發布者姓氏"],"answer":0,"why":"未確認單位便無法正確比較。"}},{"title":"人口與分布圖","explain":"點圖、分級設色圖等圖法各有用途；看密度時要分清總量與單位面積。","example":"人口總數高的行政區，人口密度不一定最高。","pitfall":"總數、比率、密度不可混用。","question":{"q":"比較兩縣人口「密度」，需用到？","options":["人口與面積","人口與地名筆畫","只有面積","只有人口"],"answer":0,"why":"人口密度＝人口數／面積。"}},{"title":"讀圖四步","explain":"先看題旨、圖名、圖例、單位，接著比對各區差異，最後才推論原因。","example":"看到山區降水較多，先描述圖上資料，再推理與地形抬升的關係。","pitfall":"推論需有圖上證據，不能直接當成已知事實。","question":{"q":"讀圖後要解釋差異，較可靠的是？","options":["先觀察資料再提出推論","直接猜熟悉選項","忽略圖例","只記顏色"],"answer":0,"why":"將觀察與推論分開，才能避免以偏概全。"}}]},{"id":"hist1","subject":"歷史","title":"歷史研究與史前時代","icon":"🏺","focus":"史料、考古、石器、時代分期","sections":[{"title":"歷史證據有哪些","explain":"文字史料、器物、遺址、口述等可以提供不同面向的資訊；歷史解釋要根據可查證的證據。","example":"在遺址挖到陶片，可推測當時人群使用陶器，但不能只憑陶片得知每個人的名字。","pitfall":"史料不等於完全不會出錯，仍要檢驗來源。","question":{"q":"在遺址挖到陶片，最直接能證明？","options":["當時曾使用陶器","每人姓名","當時政體","所有人的年齡"],"answer":0,"why":"器物本身可以支持陶器使用的推論。"}},{"title":"為何有史前時代","explain":"一般以文字記載是否出現作為史前與歷史時代的重要區分，但各地時間不同。","example":"同一時期有些文明已使用文字，另一些地區仍主要依靠考古材料重建歷史。","pitfall":"史前不等於沒有文化。","question":{"q":"「史前時代」通常最重要的區分依據是？","options":["文字記載","氣溫高低","人口多寡","房屋高度"],"answer":0,"why":"是否具有文字記錄是常見的重要分期依據。"}},{"title":"石器到金屬器","explain":"以工具材料和製作技術觀察生活方式演變，但不是所有地方都同步改變。","example":"磨製石器有助於不同活動；陶器常與煮食、儲物等生活用途有關。","pitfall":"不能用單一工具斷言一個社會的全部生活。","question":{"q":"哪項是考古發現的「觀察」？","options":["出土石器表面有磨痕","他們一定很幸福","統治者很嚴厲","人民必然信仰相同"],"answer":0,"why":"磨痕是可見物證，其他為需要更多證據的推論。"}},{"title":"推論與證據","explain":"看到遺址有墓葬或房屋，先描述證據，再提出可能的社會活動解釋。","example":"「有火燒痕跡」是觀察；「可能有生火活動」是推論。","pitfall":"不要把推論寫成百分之百確定的事實。","question":{"q":"不同地區的史前文化發展？","options":["可能不同步","必然同一天轉變","只看地圖面積","沒有生活差異"],"answer":0,"why":"不同地區發展步調與文化表現可能不同。"}}]},{"id":"hist2","subject":"歷史","title":"臺灣早期人群與文化","icon":"🪨","focus":"長濱、圓山、卑南文化與文化比較","sections":[{"title":"臺灣史前的研究","explain":"臺灣有不同時期的考古遺址，研究者以地層、器物與其他資料重建人群生活。","example":"遺址的名稱常取自發現地，不代表是當時居民自稱的族名。","pitfall":"遺址名稱、年代與文化特徵要分開記憶。","question":{"q":"長濱文化常與臺灣哪一時代的考古研究相關？","options":["舊石器時代","工業革命","近代","當代"],"answer":0,"why":"長濱文化是臺灣舊石器時代的重要考古文化。"}},{"title":"長濱文化","explain":"長濱文化常被列入臺灣舊石器時代的重要例子，反映早期人群的工具及生活活動。","example":"看到打製石器的題目，先判斷其用途與文化分期，再對照題目問什麼。","pitfall":"石器形狀一樣不代表同時期。","question":{"q":"比較圓山與卑南文化，最合適整理哪些欄位？","options":["年代、位置、遺物","字數、排版、顏色","新聞發布日期","課本重量"],"answer":0,"why":"考古文化的年代、位置及器物特徵最有助比較。"}},{"title":"圓山與卑南","explain":"圓山文化、卑南文化屬臺灣史前考古的重要研究對象；比較時留意地域、遺物與年代，不要互相混淆。","example":"在比較表中分欄記錄地點、生活工具與墓葬或特殊遺物。","pitfall":"不可用現代行政區名稱直接推論古人族群。","question":{"q":"考古文化名稱通常？","options":["可能以發現地命名","一定是居民自稱","一定是國名","一定是語言名稱"],"answer":0,"why":"遺址及文化命名常與發現地相關。"}},{"title":"文化與人群","explain":"史前文化分類是考古學的研究工具，不應直接把文化名稱和現代族群畫上等號。","example":"同一類型陶器分布於多個遺址，還需其他證據才能推論人群互動。","pitfall":"相似器物不必然表示完全相同的文化。","question":{"q":"「遺物外形相似」能直接證明兩群人完全相同嗎？","options":["不能，仍需其他證據","可以，無須證據","看字型即可","只需比較面積"],"answer":0,"why":"文化的相似性不能直接等同於同一人群。"}}]},{"id":"hist3","subject":"歷史","title":"原住民族與歷史敘事","icon":"🪶","focus":"口述傳統、文化多樣性、歷史觀點","sections":[{"title":"不同的歷史材料","explain":"原住民族的口述傳統、生活文化與文字紀錄能互補理解歷史。","example":"研究同一事件時，可比較不同群體的記憶與文獻。","pitfall":"口述史也需確認記錄條件及脈絡。","question":{"q":"研究原住民族歷史可使用？","options":["口述傳統與其他史料交互參照","只有單一教科書","只靠猜測","只有地名"],"answer":0,"why":"口述與文獻、物證等可相互補充。"}},{"title":"文化有多樣性","explain":"不同族群的語言、祭儀、居住環境和生活方式各具特色，不能用單一印象概括。","example":"即使在同一地區，社群的文化實踐也可能不同。","pitfall":"尊重差異，不把文化當成固定不變。","question":{"q":"文化差異最合理的態度是？","options":["尊重並理解脈絡","用單一印象分類","認為所有族群相同","忽略差異"],"answer":0,"why":"文化具有多樣性，需從脈絡理解。"}},{"title":"歷史中的觀點","explain":"不同資料可能因記錄者立場、目的、年代而有差異；應先比對而不是擅自取捨。","example":"兩段紀錄描述同一事件不同面向，可以先找共同事實與爭議處。","pitfall":"出現不同說法不代表全部都沒有價值。","question":{"q":"史料不同時，應如何判斷？","options":["比較來源、年代與立場","只看第一篇","只挑最短篇","不需核對"],"answer":0,"why":"交叉比對有助理解歧異原因。"}},{"title":"歷史詮釋","explain":"整理年代、地點、人物與證據，再嘗試提出最合理的解釋，遇到資料不足應標示不確定。","example":"依已知器物與傳說提出假說，但不要把未證實的細節寫進結論。","pitfall":"區分證據、假說及結論。","question":{"q":"資料不足時，歷史研究應？","options":["說明尚不能確認","直接補上想像","一律斷言","忽略材料"],"answer":0,"why":"對證據的限制保持透明。"}}]},{"id":"civ1","subject":"公民","title":"人性尊嚴與人權保障","icon":"⚖️","focus":"人性尊嚴、平等、人權、權利與責任","sections":[{"title":"人人都值得尊重","explain":"人性尊嚴不因成績、外貌、年齡、身分而有不同的基本價值。","example":"班級討論時，即使不同意別人的想法，也應尊重對方表達的權利。","pitfall":"尊重不代表必須贊同每個主張。","question":{"q":"哪項最符合尊重人性尊嚴？","options":["不因外表或成績貶低同學","依成績決定人格價值","嘲笑不同習慣","拒絕傾聽他人"],"answer":0,"why":"每個人都具有應被尊重的基本人格價值。"}},{"title":"人權如何保障","explain":"人權包括生命、自由、平等、隱私等重要面向，法律與制度可提供保障途徑。","example":"發現有人被不當對待，可尋求可信任的師長和正式申訴管道。","pitfall":"權利不是想做什麼都不受限制。","question":{"q":"同學個資遭公開，最直接涉及哪項權利？","options":["隱私權","行車優先權","投票程序","財產稅"],"answer":0,"why":"未經同意散布個人資料可能侵害隱私。"}},{"title":"平等與合理差異","explain":"平等強調人格價值與權利保障，對不同處境的人可能需要適切協助才能有實質參與機會。","example":"教室提供坡道與無障礙設施，是讓不同需求的人更容易參與。","pitfall":"公平不一定等於所有人得到完全相同的資源。","question":{"q":"設置無障礙坡道有助於？","options":["提供實質參與機會","剝奪所有人的自由","取消公共設施","讓規範失效"],"answer":0,"why":"適切設施能減少參與障礙。"}},{"title":"權利與責任","explain":"行使自由要顧及他人權利及公共利益；公共討論需以事實和理性為基礎。","example":"享有發言自由時，仍不能任意散布傷害他人的不實資訊。","pitfall":"不能以「我有自由」否定他人權利。","question":{"q":"行使自由時應同時？","options":["尊重他人權利","忽略法律","隨意傷害他人","拒絕承擔責任"],"answer":0,"why":"自由的行使應尊重他人與公共秩序。"}}]},{"id":"civ2","subject":"公民","title":"個人、家庭與社會互動","icon":"🤝","focus":"社會化、角色、家庭多樣性、溝通","sections":[{"title":"社會化是什麼","explain":"人會透過家庭、學校、同儕、媒體等學習規範、價值與生活技能。","example":"剛入國中，學習新的班級作息與合作方式也是社會化的一部分。","pitfall":"社會化不是只有兒童時期才發生。","question":{"q":"以下哪個是社會化的例子？","options":["學習班級合作規範","單純測量身高","地球公轉","計算經度"],"answer":0,"why":"透過群體互動學習規範屬於社會化。"}},{"title":"社會角色","explain":"一個人可能同時是家人、學生、朋友，依情境承擔不同期待與責任。","example":"學生在班級負責整理器材，在家中則協助家務，角色可以切換。","pitfall":"角色不代表人格有高低。","question":{"q":"一個人可以同時擁有多種社會角色嗎？","options":["可以，依情境切換","不可以，只能有一種","只能在學校有角色","成年後才有"],"answer":0,"why":"個人會在不同群體中扮演不同角色。"}},{"title":"家庭型態與支持","explain":"家庭成員組合可能不同，重要的是尊重彼此及維持照顧與溝通。","example":"不要用單一家庭形式推測別人的幸福或能力。","pitfall":"不同家庭型態不意味價值高低。","question":{"q":"面對不同家庭型態，應如何對待？","options":["尊重差異","用外表評價","推定都一樣","拒絕交流"],"answer":0,"why":"尊重不同家庭背景，不應貼標籤。"}},{"title":"溝通與衝突","explain":"表達自身感受、傾聽他人需求、尋找可行安排，通常比貼標籤更有助解決問題。","example":"分組作業意見不同時，先釐清分工與期限，再尋求共識。","pitfall":"衝突不必然等於關係失敗。","question":{"q":"分組產生爭議，較可行的第一步是？","options":["澄清需求與問題","直接責罵","散布流言","停止所有溝通"],"answer":0,"why":"先理解爭點才能尋求解決。"}}]},{"id":"civ3","subject":"公民","title":"公共生活與公平規則","icon":"🏫","focus":"公共規範、民主討論、校園自治、媒體識讀","sections":[{"title":"公共規範的功能","explain":"班規與公共規則用來協調行為、降低衝突並保障共同生活。","example":"圖書館保持安靜的規則可讓不同使用者公平享有閱讀環境。","pitfall":"規則應有合理目的，也可討論改善。","question":{"q":"圖書館安靜規則主要為了？","options":["維護共同使用權益","限制所有人的閱讀","禁止討論規則","讓人只看手機"],"answer":0,"why":"合理規範可協調共同空間使用。"}},{"title":"討論與參與","explain":"民主討論重視表達、傾聽、理由與程序，不代表每個提議都一定通過。","example":"班會討論校外教學地點時，先蒐集資訊、提出理由，依合理程序決定。","pitfall":"多數決不能任意侵害少數人的基本權利。","question":{"q":"班會民主討論時較適當的做法是？","options":["提出理由並傾聽","只讓一人說話","忽略少數意見","不看資料"],"answer":0,"why":"民主參與需要資訊與尊重。"}},{"title":"公平如何判斷","explain":"公平需要看規則是否合理、程序是否透明，及是否尊重不同人的基本權利。","example":"選拔比賽代表時，公布標準與申訴方式比私下指定更公平。","pitfall":"結果相同與程序公平是不同概念。","question":{"q":"班級幹部選舉較公平的做法是？","options":["程序公開且標準一致","私下決定結果","事後任意改規則","拒絕解釋"],"answer":0,"why":"透明一致的程序有助確保公平。"}},{"title":"媒體識讀","explain":"碰到轉傳訊息，先 const deepExtra={"ch1":["先讀「景物如何變成一幅圖」，再找人物感受有沒有明確出現。","把「樹影在跳舞」和「樹影像黑色絲帶」並排：前句把影子當人，後句將影子比成另一事物。","朗讀時感受節奏，再問「安靜」是從畫面還是語氣推得。"],"ch2":["把眼睛看見的場景與「我因此想到……」的感悟分成兩欄。","「有人匆匆離開，有人靜靜守候」是對照；要進一步判斷這個對照突出何種感受。","為主旨提出一個具體事件證據，再補一句自己的推論。"],"ch3":["記錄事情的時間順序：「當時看到什麼、做了什麼、現在想起什麼」。","「兩碗冰」的碗用來計數；「洗淨瓷碗」的碗是物件本身。","把「舌尖微甜」和「手心冰涼」分屬味覺與觸覺，整理感受描寫作用。"],"punct":["連續列舉文具時要看有沒有並列關係，才能選頓號。","直接提問要用問號；若只是轉述一個疑問，標點須看整句語氣。","冒號可以引出接下來要說的內容，引號則標示直接引語。"],"ch4":["如果角色把重要事情當成「差不多就好」，結果可能不只是一個小失誤。","「真是仔細」也可能是反話，要觀察其行動與結果是否相反。","想想藥物劑量、時刻表這類不能模糊帶過的生活場景。"],"ch5":["把「學習、反省、待人」三類觀念分開做筆記，再在原句找依據。","「三人行」不必僅指固定三人，重點在見人有可學習之處。","以自己不喜歡被對待的方式來思考怎麼對待他人。"],"ch6":["描述職務時，不要只記稱呼，應掌握具體工作及對大家的影響。","比較「默默耕耘」與「譁眾取寵」的語意及感情色彩。","試著寫一句有行動證據的感謝，而不是空泛稱讚。"],"read":["看到一篇文章，先猜主要問題，再用正文檢查自己的預測。","把三段材料整理成每段一句核心主旨，捨去不影響理解的細節。","搜尋政府統計時記得紀錄年份與單位，避免把過時數據當新資料。"],"ch7":["仔細分開「看到的小昆蟲」與「想像的巨獸」兩層敘述。","文言單字可能有不同古今意義，要放回整句判斷。","試想同一個小物件為何能在孩子眼裡變成一場冒險。"],"ch8":["紙船是物件，也是引出人物與記憶的線索。","「弱冠」「而立」來自傳統用語，先確認題目是否問年齡代稱。","若某個動作在回憶中反覆出現，要問它與親情有何關聯。"],"ch9":["先分開雨的聲音、顏色與溫度，再分類感官描寫。","「滴答」模擬聲響；「落雨」只描述事件，兩者功能不同。","雨天引出舊時的人與事，是景物連結情感的常見寫法。"],"ch10":["先記元宵節常見的賞燈與猜燈謎活動，再理解場景中的人物互動。","猜燈謎不能只抓一個字，需同時檢查各條線索。","節俗描寫可能結合對地方社群、親友的回憶。"],"self1":["遇到較長的學習任務，先拆成可以完成的小步驟。","分辨「有做很多事」與「做得有效率」的不同。","把今天要做的事分成重要、緊急、可以安排稍後的項目。"],"self2":["從角色「做了什麼」建立印象，不以單一外表推斷能力。","比較直接動作敘述與閱讀者自行猜測的內心感受。","遇到形近字應用整個詞語和句子確認字義。"],"self3":["先列事情的起因、發展、轉折與結果，再說明標題的作用。","「出乎意料」不能套用到完全符合預期的事件。","讀有懸念的故事時，檢查每個關鍵轉折是否有前文線索。"]};

function deepMap(){const ps=deepSave(),mand=fullBookUnits,soc=socialDeep;
const mapCard=(u)=>{let prog=ps[u.id]||{},cnt=Object.keys(prog.passed||{}).length,tot=deepContent(u).length;return `<article class="fullcard"><div class="official-tag">${u.number||u.subject} · ${cnt}/${tot} 段</div><h3>${u.icon} ${u.title}</h3><div class="minor">${u.focus}</div><div class="bar"><div style="width:${cnt/tot*100}%"></div></div><div class="actions"><button class="btn primary" onclick="deepStart('${u.id}')">${cnt?'繼續精讀':'開始精讀'} →</button><button class="btn" onclick="deepTest('${u.id}')">章節測驗</button></div></article>`};
const total=mand.length+soc.length,done=deepAll().filter(u=>Object.keys(ps[u.id]?.passed||{}).length>=deepContent(u).length).length;
screen.innerHTML=`<div class="hero"><div><div class="label">V7 · DEEP LEARNING MAP</div><h2>🗺️ 國文＋社會｜全冊精讀地圖</h2><p>不是先考試：每段先讀背景及詳細解釋、看生活例子和常見陷阱，再答 1 題立即理解題；通過後解鎖下一段。</p><div class="minor">已完成 ${done} / ${total} 個主題 · 各段學習進度自動儲存在本機</div><div class="actions"><button class="btn" onclick="deepMixedExam()">📝 國文＋社會綜合模擬考</button></div></div><span class="iconbig">🧠</span></div><div class="notice">📌 國文 15 單元為基於官方單元目錄及題型的原創分主題導讀，不是課文自然段原文重現。社會地理參照已上傳試卷第 1、2 回可辨識的考點；其他社會單元是依國一核心概念設計的補充教學，並未聲稱與整套試卷章節一一對應。</div><h2>📘 國文｜10 課＋語文天地＋自學</h2><div class="fullgrid">${mand.map(mapCard).join('')}</div><h2 style="margin-top:24px">🌏 社會｜地理、歷史、公民</h2>${['地理','歷史','公民'].map(subject=>`<h3>${subject}</h3><div class="fullgrid">${soc.filter(u=>u.subject===subject).map(mapCard).join('')}</div>`).join('')}`;
}
function deepStart(id){const u=deepUnit(id),p=deepSave()[id]||{};let total=deepContent(u).length;let step=Array.from({length:total},(_,i)=>i).find(i=>!p.passed?.[i]);deepState={id,step:step??0,selected:null};deepRender()}
function deepRender(){const st=deepState,u=deepUnit(st.id),sections=deepContent(u),s=sections[st.step],p=deepSave()[st.id]||{},passed=!!p.passed?.[st.step],q=s.question;
screen.innerHTML=`<div class="deep-wrap"><button class="btn" onclick="deepState=null;deepMap()">← 返回完整學習 MAP</button><div class="hero" style="margin-top:14px"><div><div class="label">${u.number||u.subject} · ${u.title}</div><h2>${u.icon} ${s.title}</h2><p>精讀單元 ${st.step+1}/${sections.length} · 完成此段理解題才解鎖下一段</p><div class="bar"><div style="width:${Object.keys(p.passed||{}).length/sections.length*100}%"></div></div></div><span class="iconbig">📖</span></div><div class="deep-lesson"><div class="deep-brow">📚 第一部分｜詳細說明</div><p>${s.explain}</p><div class="deep-pair"><div><b>🌱 生活例子／實際判讀</b><p>${s.example}</p></div><div><b>⚠️ 常見錯誤</b><p>${s.pitfall}</p></div></div><div class="deep-brow">🧩 第二部分｜本段理解小測驗</div><h3>${q.q}</h3><div class="full-choices">${q.options.map((x,i)=>`<button onclick="deepPick(${i})" ${passed?'disabled':''} style="${passed&&i===q.answer?'background:#21463e;border-color:#59d3a5':''}">${'ABCD'[i]}. ${x}</button>`).join('')}</div>${st.selected!==null?`<div class="${st.selected===q.answer?'full-done':'full-wrong'}">${st.selected===q.answer?'✅ 理解正確':'再試一次，先讀重點提示'}<p>${q.why}</p></div>`:''}${passed?`<div class="full-done">✅ 已通過本段，可前往下一段，也可回頭複習。</div>`:''}<div class="actions"><button class="btn" onclick="deepStep(-1)" ${st.step===0?'disabled':''}>← 上一段</button><button class="btn primary" onclick="deepStep(1)" ${!passed?'disabled':''}>${st.step===sections.length-1?'完成單元 →':'下一段 →'}</button></div></div></div>`;window.scrollTo(0,0)}
function deepPick(i){let st=deepState,u=deepUnit(st.id),sections=deepContent(u),q=sections[st.step].question;if(deepSave()[st.id]?.passed?.[st.step])return;st.selected=i;if(i===q.answer){let p=deepSave()[st.id]||{passed:{}};p.passed??={};p.passed[st.step]=true;deepSave()[st.id]=p;data.xp=(data.xp||0)+10;save()}deepRender()}
function deepStep(d){let st=deepState,secs=deepContent(deepUnit(st.id));if(d>0&&!deepSave()[st.id]?.passed?.[st.step])return;if(st.step+d>=secs.length){let id=st.id;deepState=null;deepResult(id);return}st.step=Math.max(0,st.step+d);st.selected=null;deepRender()}
function deepResult(id){const u=deepUnit(id),s=deepContent(u),pass=Object.keys(deepSave()[id]?.passed||{}).length;screen.innerHTML=`<div class="hero"><div><h2>🎉 ${u.title}｜學習完成</h2><p>已通過 ${pass}/${s.length} 段理解小測驗。每段題目均附原因解析，還可以再做不同的章節題。</p><div class="actions"><button class="btn primary" onclick="deepTest('${id}')">挑戰本課章節測驗 →</button><button class="btn" onclick="deepMap()">返回學習 MAP</button></div></div></div>`}
function deepTest(id){const u=deepUnit(id),sections=deepContent(u),p=deepSave()[id]||{},n=Object.keys(p.passed||{}).length;if(n<sections.length){deepState={id,step:Array.from({length:sections.length},(_,i)=>i).find(i=>!p.passed?.[i])??0,selected:null};deepRender();return}deepExamStart(sections.map((x,i)=>({unit:u,question:x.question,section:i})),u.title)}
let deepExam=null;
function deepExamStart(items,title){deepExam={items:items.sort(()=>Math.random()-.5),title,index:0,answers:[]};deepExamRender()}
function deepExamRender(){let ex=deepExam,i=ex.index,x=ex.items[i],q=x.question,ans=ex.answers[i];screen.innerHTML=`<div class="deep-wrap"><button class="btn" onclick="deepExam=null;deepMap()">← 返回地圖</button><div class="deep-lesson"><div class="deep-brow">${ex.title} · ${i+1}/${ex.items.length}</div><div class="minor">${x.unit.subject||'國文'}｜${x.unit.title}</div><h2>${q.q}</h2><div class="full-choices">${q.options.map((v,k)=>`<button onclick="deepExamPick(${k})" style="${ans===k?'border-color:#66d5ae;background:#21453d':''}">${'ABCD'[k]}. ${v}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="deepExamGo(-1)" ${i===0?'disabled':''}>上一題</button><button class="btn primary" onclick="deepExamGo(1)" ${ans===undefined?'disabled':''}>${i===ex.items.length-1?'交卷':'下一題 →'}</button></div></div></div>`}
function deepExamPick(i){deepExam.answers[deepExam.index]=i;deepExamRender()}
function deepExamGo(n){let e=deepExam;if(n>0&&e.answers[e.index]===undefined)return;if(e.index+n>=e.items.length){deepExamFinish();return}e.index=Math.max(0,e.index+n);deepExamRender()}
function deepExamFinish(){let ex=deepExam,score=ex.items.reduce((v,x,i)=>v+(ex.answers[i]===x.question.answer?1:0),0),pct=Math.round(100*score/ex.items.length);data.history??=[];data.history.unshift({at:new Date().toLocaleString('zh-TW'),type:'exam',world:ex.title,level:'V7 精讀模擬考',correct:score,total:ex.items.length,score:pct});data.history=data.history.slice(0,100);data.xp=(data.xp||0)+score*10;save();deepExam=null;screen.innerHTML=`<div class="hero"><div><h2>📊 ${ex.title}｜${pct} 分</h2><p>答對 ${score}/${ex.items.length} 題，答案解析如下。</p><div class="actions"><button class="btn primary" onclick="deepMap()">回學習地圖</button><button class="btn" onclick="deepExamStart(${''}deepAll().map(u=>({unit:u,question:deepContent(u)[Math.floor(Math.random()*deepContent(u).length)].question})), '國文＋社會綜合模擬考')">再考一次</button></div></div></div><div class="deep-wrap">${ex.items.map((x,i)=>`<div class="full-step"><b>${i+1}. ${x.unit.title}：${x.question.q}</b><p>${ex.answers[i]===x.question.answer?'✅':'❌'} 你的答案：${x.question.options[ex.answers[i]]}</p><p>正確答案：${x.question.options[x.question.answer]}</p><div class="minor">${x.question.why}</div></div>`).join('')}</div>`}
function deepMixedExam(){deepExamStart(deepAll().map(u=>({unit:u,question:deepContent(u)[Math.floor(Math.random()*deepContent(u).length)].question})), '國文＋社會綜合模擬考')}

// V8 RPG engine: all stages use authored V7 course explanations and answer-keyed questions.
// It is an original practice game, not an imported official exam or an exact transcription of passages.
let rpg=null;
function rpgData(){data.rpg??={cleared:{},coins:0,relics:{},attempts:{},potions:2};return data.rpg}
function rpgIsClear(id){return !!rpgData().cleared[id]}
function rpgGroup(u){return u.subject||'國文'}
function rpgAll(){return deepAll()}
function rpgHealth(x){return '❤️'.repeat(Math.max(0,x))+'🖤'.repeat(Math.max(0,3-x))}
function rpgHud(){let d=rpgData();return `<div class="rpg-hud"><span>❤️ 生命 ${rpg?rpg.hp:3}/3</span><span>🪙 金幣 ${d.coins}</span><span>🧪 補血藥 ${d.potions}</span><span>💎 遺物 ${Object.keys(d.relics).length}/${rpgAll().length}</span></div>`}
function rpgMap(){rpg=null;let d=rpgData(),units=rpgAll(),done=units.filter(u=>rpgIsClear(u.id)).length;const card=u=>{const ok=rpgIsClear(u.id),sec=deepContent(u);return `<article class="rpg-zone"><div class="rpg-icon">${u.icon}</div><div class="minor">${u.number||u.subject} · ${ok?'🏆 已征服':'未通關'}</div><h3>${u.title}</h3><p>${u.focus}</p><div class="rpg-road"><span class="on"></span><span class="${ok?'on':''}"></span><span class="${ok?'on':''}"></span><span class="${ok?'on':''}"></span></div><button class="btn primary" onclick="rpgStart('${u.id}')">${ok?'再次冒險':'進入冒險'} →</button><button class="btn" onclick="deepStart('${u.id}')">📖 詳細精讀（${sec.length} 節）</button></article>`};screen.innerHTML=`<section class="rpg-hero"><div class="label">V8 · QUEST RPG</div><h2>⚔️ 文史秘境：知識守護者</h2><p>冒險流程：調查知識線索 → 破解順序機關 → 3 回合 Boss 戰 → 開寶箱。每個挑戰都根據本課的原創導讀與練習題編寫。</p>${rpgHud()}<div class="rpg-road">${Array.from({length:units.length},(_,i)=>`<span class="${i<done?'on':''}"></span>`).join('')}</div><p class="minor">完成 ${done}/${units.length} 主題 · 進度沿用 V7 儲存格式，RPG 紀錄另存在同一進度檔案中。</p><div class="actions"><button class="btn" onclick="rpgInventory()">🎒 冒險背包</button><button class="btn" onclick="deepMixedExam()">📝 綜合模擬考</button><button class="btn" onclick="change('adventure')">📘 精讀地圖</button></div></section><h2>📚 國文大陸｜15 個冒險章節</h2><div class="rpg-grid">${units.filter(u=>rpgGroup(u)==='國文').map(card).join('')}</div><h2 style="margin-top:26px">🌏 社會大陸｜地理／歷史／公民</h2>${['地理','歷史','公民'].map(x=>`<h3>${x}</h3><div class="rpg-grid">${units.filter(u=>rpgGroup(u)===x).map(card).join('')}</div>`).join('')}<p class="minor">題目與故事為原創教材活動；尚未將全部 A/B/C 試卷題目逐題校對匯入，課文引用請以正式教科書核對。</p>`;}
function rpgInventory(){let d=rpgData();screen.innerHTML=`<section class="rpg-panel"><h2>🎒 探險背包</h2>${rpgHud()}<h3>💎 知識遺物</h3><div class="rpg-inventory">${Object.keys(d.relics).length?Object.keys(d.relics).map(id=>`<span>${deepUnit(id)?.icon||'💎'} ${deepUnit(id)?.title||id}</span>`).join(''):'<p>還沒收集遺物。每個主題首次擊敗 Boss 都會獲得一枚。</p>'}</div><hr class="rpg-sep"><h3>🧪 補給站</h3><p>每場出發時恢復三顆生命；冒險中可使用補血藥恢復一顆。補血藥可以用 30 金幣購買。</p><button class="btn primary" onclick="rpgBuy()" ${d.coins<30?'disabled':''}>30 金幣購買補血藥</button><div class="actions"><button class="btn" onclick="rpgMap()">返回冒險地圖</button></div></section>`}
function rpgBuy(){let d=rpgData();if(d.coins<30)return;d.coins-=30;d.potions++;save();rpgInventory()}
function rpgPotion(){let d=rpgData();if(!rpg||rpg.hp>=3||d.potions<=0)return;d.potions--;rpg.hp++;save();rpgScene()}
function rpgStart(id){const u=deepUnit(id);if(!u)return;let d=rpgData();d.attempts[id]=(d.attempts[id]||0)+1;save();rpg={id,stage:0,hp:3,clues:[],sequence:[],boss:0,bossHp:3,used:[],feedback:'',bad:false,selected:null};rpgScene()}
function rpgUnit(){return deepUnit(rpg.id)}
function rpgInfo(){return deepContent(rpgUnit())}
function rpgBase(){const u=rpgUnit();return `<button class="btn" onclick="rpgMap()">← 返回 RPG 地圖</button><div class="label" style="margin-top:15px">${u.number||u.subject} · ${u.title} · ${['調查線索','機關解謎','守護者首領','寶箱結算'][rpg.stage]}</div><h2>${u.icon} ${u.title}｜${['遺跡探查','古代機關','知識守護者','勝利獎勵'][rpg.stage]}</h2>${rpgHud()}<div class="rpg-road">${[0,1,2,3].map(i=>`<span class="${i<=rpg.stage?'on':''}"></span>`).join('')}</div>`}
function rpgScene(){if(!rpg){rpgMap();return}let st=rpg.stage,secs=rpgInfo(),u=rpgUnit(),html=`<section class="rpg-panel">${rpgBase()}`;
if(st===0){let q=secs[0].question;html+=`<div class="rpg-scene">${u.icon} 🧭 🔍</div><div class="dialogue"><b>🧙 知識嚮導</b><p>秘境入口有一道封印。先讀這節的說明，再找出符合知識的線索！</p></div><div class="rpg-cue"><b>📖 線索卷軸：${secs[0].title}</b><p>${secs[0].explain}</p><p><b>生活應用：</b>${secs[0].example}</p></div><h3>🔍 搜尋線索：${q.q}</h3><div class="rpg-buttons">${q.options.map((o,i)=>`<button onclick="rpgClue(${i})">${'ABCD'[i]}. ${o}</button>`).join('')}</div>`;}
if(st===1){let titles=secs.slice(0,3).map((x,i)=>({title:x.title,i}));let order=rpg.sequence;let remaining=titles.filter(x=>!order.includes(x.i));html+=`<div class="rpg-scene">🗿 🔐 🧩</div><p>**機關提示：** 依照課程的學習順序，將三塊知識石板排回原位。點選下方石板即可放入凹槽，若選錯順序，系統會提供提示。</p><div class="rpg-cue"><b>📜 石門提示</b><p>第一塊是進入主題的起點，再來是主要內容。回想剛才讀過的課程安排，依序選出三塊石板。</p><small>這是學習步驟排序，不是聲稱課文內事件的時間順序。</small></div><h3>已放入：${order.length?order.map(i=>titles[i].title).join(' → '):'尚未放入石板'}</h3><div class="rpg-tiles">${remaining.slice().reverse().map(x=>`<button onclick="rpgTile(${x.i})">🪨 ${x.title}</button>`).join('')}</div><button class="btn" onclick="rpgSequenceReset()">重置石板</button>`;}
if(st===2){let i=rpg.boss,q=secs[Math.min(i+1,secs.length-1)].question;html+=`<div class="rpg-boss"><div style="font-size:65px">👾</div><div><b>知識守護者 · 護盾 ${rpg.bossHp}/3</b><div class="bar"><div style="width:${100*rpg.bossHp/3}%;background:#f3a0b5"></div></div><span class="minor">答對攻擊一格；答錯損失一顆生命並獲得提示</span></div></div><h3>⚔️ 第 ${i+1}/3 回合：${q.q}</h3><div class="rpg-buttons">${q.options.map((x,k)=>`<button onclick="rpgFight(${k})">${'ABCD'[k]}. ${x}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="rpgPotion()" ${rpg.hp===3||rpgData().potions===0?'disabled':''}>🧪 使用補血藥（${rpgData().potions}）</button><button class="btn" onclick="rpgHelp()">📖 查看本段知識</button></div>`;}
if(st===3){let d=rpgData(),won=rpg.hp>0;html+=`<div class="rpg-scene">${won?'🏆 💎 🎁':'🩹 🛡️'}</div><h2>${won?'Boss 已擊敗！':'冒險暫時失敗'}</h2><p>${won?'你解開了知識封印，獲得遺物與冒險金幣。':'生命值歸零了。你可以查看詳細精讀、補充觀念，再挑戰同一位 Boss。'}</p><div class="rpg-inventory">${won?`<span>💎 ${u.title}遺物</span><span>🪙 金幣 +${rpg.reward||0}</span>`:'<span>📖 建議回顧本課解說</span>'}</div><div class="actions"><button class="btn primary" onclick="rpgStart('${u.id}')">${won?'重新挑戰':'再次挑戰'}</button><button class="btn" onclick="deepStart('${u.id}')">詳細精讀</button><button class="btn" onclick="rpgMap()">返回地圖</button></div>`;}
if(rpg.feedback)html+=`<div class="rpg-alert ${rpg.bad?'bad':''}">${rpg.feedback}</div>`;
screen.innerHTML=html+'</section>';window.scrollTo(0,0)}
function rpgClue(i){const s=rpgInfo()[0],q=s.question;if(i!==q.answer){rpg.hp=Math.max(1,rpg.hp-1);rpg.feedback='❗ 這不是正確線索。'+q.why+'；你可以再試一次。';rpg.bad=true;rpgScene();return}rpg.stage=1;rpg.feedback='✅ 已找到正確線索！ '+q.why;rpg.bad=false;rpgScene()}
function rpgTile(i){if(i!==rpg.sequence.length){rpg.feedback='🧩 石板順序不對。先按照學習單元的先後排序，看看哪塊石板應該先放。';rpg.bad=true;rpgScene();return}rpg.sequence.push(i);rpg.bad=false;if(rpg.sequence.length===3){rpg.stage=2;rpg.feedback='✨ 你打開了石門，知識守護者出現了！'}else rpg.feedback='✅ 石板正確，繼續拼下一塊。';rpgScene()}
function rpgSequenceReset(){rpg.sequence=[];rpg.feedback='石板已重置。';rpg.bad=false;rpgScene()}
function rpgHelp(){const s=rpgInfo()[Math.min(rpg.boss+1,rpgInfo().length-1)];rpg.feedback='📖 <b>'+s.title+'</b>：'+s.explain+'<br><b>易錯觀念：</b>'+s.pitfall;rpg.bad=false;rpgScene()}
function rpgFight(i){let q=rpgInfo()[Math.min(rpg.boss+1,rpgInfo().length-1)].question;if(i===q.answer){rpg.bossHp--;rpg.boss++;rpg.feedback='⚔️ 攻擊成功！'+q.why;rpg.bad=false;if(rpg.bossHp===0){let d=rpgData(),first=!d.cleared[rpg.id];rpg.reward=first?50:15;d.coins+=rpg.reward;d.cleared[rpg.id]=true;d.relics[rpg.id]=true;data.xp=(data.xp||0)+(first?60:20);save();rpg.stage=3}}else{rpg.hp--;rpg.feedback='🛡️ 守護者反擊！'+q.why+'。可以開啟知識提示再答。';rpg.bad=true;if(rpg.hp<=0){rpg.stage=3}}rpgScene()}

// Map v7 aliases: preserve original tabs and old modules through the separate classic practice modes
adventure=deepMap;
